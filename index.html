/* SHOW HISTORY */

function showHistory(){

document.getElementById("drawCount").innerText=
results.length+" දිනුම්";

let h="";

results.forEach(r=>{

h+=`
<div class="history">

<b>📅 ${r.date}</b><br>

Draw No:
<b>${r.draw}</b><br>

අකුර:
<b>${r.letter}</b><br>

දිනුම් අංක:
<b>
${r.numbers.map(n=>
String(n).padStart(2,"0")
).join(", ")}
</b>

</div>
`;

});

document.getElementById("history").innerHTML=h;

}


/* STATISTICS */

function showStatistics(){

let count={};

results.forEach(r=>{

r.numbers.forEach(n=>{

count[n]=(count[n]||0)+1;

});

});


let sorted=Object.entries(count)
.sort((a,b)=>b[1]-a[1]);


let text=
"<b>අංක පැමිණි වාර ගණන</b><br><br>";


sorted.forEach(x=>{

text+=`
<div class="stat">
අංක <b>${String(x[0]).padStart(2,"0")}</b>
→ <b>${x[1]}</b> වරක්
</div>
`;

});


document.getElementById("result").innerHTML=text;
